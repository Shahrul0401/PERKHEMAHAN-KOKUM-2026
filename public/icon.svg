    <path d="M196 102 C212 118 214 132 204 142 C198 146 190 145 186 139 C178 128 184 114 196 102 Z" fill="#ef4444" stroke="#facc15" stroke-width="2"/>

    <!-- Top-Right Icon: Open Book -->
    <path d="M282 124 Q298 118 314 126 L314 170 Q298 162 282 168 Z" fill="#ffffff" stroke="#111827" stroke-width="4"/>
    <path d="M346 124 Q330 118 314 126 L314 170 Q330 162 346 168 Z" fill="#ffffff" stroke="#111827" stroke-width="4"/>
    <line x1="289" y1="138" x2="307" y2="140" stroke="#111827" stroke-width="3"/>
    <line x1="289" y1="150" x2="307" y2="152" stroke="#111827" stroke-width="3"/>
    <line x1="321" y1="140" x2="339" y2="138" stroke="#111827" stroke-width="3"/>
    <line x1="321" y1="152" x2="339" y2="150" stroke="#111827" stroke-width="3"/>

    <!-- Bottom-Left Icon: 3 Interlocking Rings -->
    <circle cx="188" cy="296" r="18" fill="none" stroke="#ffffff" stroke-width="7"/>
    <circle cx="188" cy="296" r="18" fill="none" stroke="#111827" stroke-width="2.5"/>
    <circle cx="214" cy="296" r="18" fill="none" stroke="#ffffff" stroke-width="7"/>
    <circle cx="214" cy="296" r="18" fill="none" stroke="#111827" stroke-width="2.5"/>
    <circle cx="201" cy="318" r="18" fill="none" stroke="#ffffff" stroke-width="7"/>
    <circle cx="201" cy="318" r="18" fill="none" stroke="#111827" stroke-width="2.5"/>

    <!-- Bottom-Right Icon: Microscope -->
    <path d="M294 338 L336 338 L332 328 L298 328 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5"/>
    <path d="M316 276 L306 310 L316 314 L326 280 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5"/>
    <path d="M318 292 C332 298 334 316 320 328" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <!-- Center Red Horizontal Ribbon: SEK KEB LUPAK -->
    <rect x="128" y="196" width="256" height="44" rx="6" fill="#ef4444" stroke="#111827" stroke-width="5"/>
    <text x="256" y="225" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="25" letter-spacing="1.5">SEK KEB LUPAK</text>

    <!-- Bottom Blue Scroll Ribbon: ILMU PELITA HIDUP -->
    <path d="M92 382 Q174 446 256 446 Q338 446 420 382 L396 356 Q326 410 256 410 Q186 410 116 356 Z" fill="#1d4ed8" stroke="#ffffff" stroke-width="5"/>
    <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="19" letter-spacing="2">ILMU PELITA HIDUP</text>
  </g>
