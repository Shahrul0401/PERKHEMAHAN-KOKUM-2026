<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b2246"/>
      <stop offset="55%" stop-color="#0d2b3e"/>
      <stop offset="100%" stop-color="#07162c"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>
  <rect x="10" y="10" width="492" height="492" rx="100" stroke="#f5c427" stroke-opacity="0.35" stroke-width="4"/>

  <g filter="url(#drop)">
    <!-- Outer Shield Outline -->
    <path d="M126 78 C175 78 215 66 256 48 C297 66 337 78 386 78 L386 248 C386 332 325 388 256 416 C187 388 126 332 126 248 Z" fill="#ffffff" stroke="#111827" stroke-width="8"/>

    <!-- Top-Left Quadrant (Green) -->
    <path d="M134 86 C178 86 216 75 256 58 L256 218 L134 218 Z" fill="#15803d"/>

    <!-- Top-Right Quadrant (Yellow) -->
    <path d="M256 58 C296 75 334 86 378 86 L378 218 L256 218 Z" fill="#facc15"/>

    <!-- Bottom-Left Quadrant (Yellow) -->
    <path d="M134 218 L256 218 L256 406 C192 380 134 326 134 248 Z" fill="#facc15"/>

    <!-- Bottom-Right Quadrant (Green) -->
    <path d="M256 218 L378 218 L378 248 C378 326 320 380 256 406 Z" fill="#15803d"/>

    <!-- Center Vertical Divider -->
    <line x1="256" y1="58" x2="256" y2="406" stroke="#111827" stroke-width="6"/>

